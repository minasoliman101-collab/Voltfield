<!-- Live calculator for calculators/watts-to-amps.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="w2aCalc">
    <h2>Watts to Amps</h2>
    <div class="sub">Steady-state current. Power factor is ignored on DC, where it has no meaning. A load quoted in VA is apparent power &mdash; use the kVA converter instead.</div>
    <div class="est-row">
      <div class="est-field"><label for="w2aPhase">System</label><select id="w2aPhase"><option value="1" selected>Single-phase AC</option><option value="3">Three-phase AC</option><option value="dc">DC</option></select></div>
      <div class="est-field"><label for="w2aW">Power (W)</label><input type="number" id="w2aW" min="0" step="1" placeholder="e.g. 1500"></div>
      <div class="est-field"><label for="w2aV">Voltage (V)</label><input type="number" id="w2aV" min="0" step="1" placeholder="e.g. 120"></div>
      <div class="est-field" id="w2aPfWrap"><label for="w2aPf">Power factor</label><input type="number" id="w2aPf" min="0.1" max="1" step="0.01" placeholder="e.g. 1.0"></div>
    </div>
    <div class="est-row"><div class="est-field"><button type="button" id="w2aBtn">Calculate</button></div></div>
    <div class="est-result" id="w2aResult"></div>
  </div>
