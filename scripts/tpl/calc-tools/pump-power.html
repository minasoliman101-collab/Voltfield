<!-- Live calculator for calculators/pump-power.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="ppCalc">
    <h2>Pump Power</h2>
    <div class="sub">Water hp = GPM &times; head &times; SG &divide; 3,960. One duty point; check the motor against the whole pump curve.</div>
    <div class="est-row">
      <div class="est-field"><label for="ppGpm">Flow (GPM)</label><input type="number" id="ppGpm" min="0" step="any" placeholder="e.g. 500"></div>
      <div class="est-field"><label for="ppHead">Total head (ft)</label><input type="number" id="ppHead" min="0" step="any" placeholder="e.g. 80"></div>
    </div>
    <div class="est-row">
      <div class="est-field"><label for="ppEff">Pump efficiency (%)</label><input type="number" id="ppEff" min="1" max="100" step="1" value="75"></div>
      <div class="est-field"><label for="ppMotorEff">Motor efficiency (%)</label><input type="number" id="ppMotorEff" min="1" max="100" step="0.1" value="93"></div>
      <div class="est-field"><label for="ppSg">Specific gravity</label><input type="number" id="ppSg" min="0.1" step="0.01" value="1.0"></div>
    </div>
    <div class="est-row"><div class="est-field"><button type="button" id="ppBtn">Calculate</button></div></div>
    <div class="est-result" id="ppResult"></div>
  </div>
