<!-- Live calculator for calculators/amps-to-kw.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="a2kCalc">
    <h2>Amps to kW</h2>
    <div class="sub">Real power at the operating point you enter. Power factor is ignored on DC, where it has no meaning.</div>
    <div class="est-row">
      <div class="est-field"><label for="a2kPhase">System</label><select id="a2kPhase"><option value="3" selected>Three-phase AC</option><option value="1">Single-phase AC</option><option value="dc">DC</option></select></div>
      <div class="est-field"><label for="a2kI">Current (A)</label><input type="number" id="a2kI" min="0" step="0.1" placeholder="e.g. 100"></div>
      <div class="est-field"><label for="a2kV">Voltage (V)</label><input type="number" id="a2kV" min="0" step="1" placeholder="e.g. 480"></div>
      <div class="est-field" id="a2kPfWrap"><label for="a2kPf">Power factor</label><input type="number" id="a2kPf" min="0.1" max="1" step="0.01" placeholder="e.g. 0.9"></div>
    </div>
    <div class="est-row"><div class="est-field"><button type="button" id="a2kBtn">Calculate</button></div></div>
    <div class="est-result" id="a2kResult"></div>
  </div>
