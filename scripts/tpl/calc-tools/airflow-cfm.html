<!-- Live calculator for calculators/airflow-cfm.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="cfmCalc">
    <h2>Airflow for a Heat Load</h2>
    <div class="sub">CFM = BTU/h &divide; (1.08 &times; &Delta;T). Sensible heat, standard air at sea level.</div>
    <div class="est-row">
      <div class="est-field"><label for="cfmKw">Heat load (kW)</label><input type="number" id="cfmKw" min="0" step="any" placeholder="e.g. 10"></div>
      <div class="est-field"><label for="cfmDt">Air temperature rise (&deg;F)</label><input type="number" id="cfmDt" min="0" step="any" placeholder="e.g. 20"></div>
    </div>
    <div class="est-row"><div class="est-field"><button type="button" id="cfmBtn">Calculate</button></div></div>
    <div class="est-result" id="cfmResult"></div>
  </div>
