<!-- Live calculator for calculators/generator-runtime.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="genCalc">
    <h3>Generator Runtime</h3>
    <div class="sub">Looking for battery/UPS backup runtime instead? See the <a class="inline" href="/calculators/bess-sizing.html">BESS sizing calculator</a>.</div>
    <div class="est-row">
      <div class="est-field"><label for="genTank">Fuel tank capacity (gal)</label><input type="number" id="genTank" min="0" step="1" placeholder="e.g. 500"></div>
      <div class="est-field"><label for="genRate">Consumption rate at load (gal/hr)</label><input type="number" id="genRate" min="0" step="0.1" placeholder="e.g. 22"></div>
      <div class="est-field"><button type="button" id="genBtn">Calculate</button></div>
    </div>
    <div class="est-result" id="genResult"></div>
  </div>
