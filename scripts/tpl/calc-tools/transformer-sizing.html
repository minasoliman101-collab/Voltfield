<!-- Live calculator for calculators/transformer-sizing.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="xfCalc">
    <h3>Transformer Size</h3>
    <div class="sub">Rounds up to the nearest standard kVA nameplate rating. Add your own margin for future load growth — this doesn't assume any.</div>
    <div class="est-row">
      <div class="est-field"><label for="xfPhase">Phase</label><select id="xfPhase"><option value="1">Single-phase</option><option value="3" selected>Three-phase</option></select></div>
      <div class="est-field"><label for="xfKw">Load (kW)</label><input type="number" id="xfKw" min="0" step="1" placeholder="e.g. 300"></div>
      <div class="est-field"><label for="xfPf">Power factor</label><input type="number" id="xfPf" min="0.1" max="1" step="0.01" placeholder="e.g. 0.9"></div>
      <div class="est-field"><label for="xfV">Secondary voltage (V)</label><input type="number" id="xfV" min="0" step="1" placeholder="e.g. 480"></div>
    </div>
    <div class="est-row"><div class="est-field"><button type="button" id="xfBtn">Calculate</button></div></div>
    <div class="est-result" id="xfResult"></div>
  </div>
