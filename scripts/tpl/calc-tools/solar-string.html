<!-- Live calculator for calculators/solar-string.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="strCalc">
    <h3>String Size</h3>
    <div class="sub">All values from the module and inverter datasheets — this tool does no lookups of its own.</div>
    <div class="est-row">
      <div class="est-field"><label for="strVoc">Module Voc, STC (V)</label><input type="number" id="strVoc" min="0" step="0.1" placeholder="e.g. 49.5"></div>
      <div class="est-field"><label for="strVmp">Module Vmp, STC (V)</label><input type="number" id="strVmp" min="0" step="0.1" placeholder="e.g. 41.4"></div>
      <div class="est-field"><label for="strTcVoc">Voc temp coeff (%/&deg;C)</label><input type="number" id="strTcVoc" step="0.01" placeholder="e.g. -0.27"></div>
      <div class="est-field"><label for="strTcVmp">Vmp temp coeff (%/&deg;C)</label><input type="number" id="strTcVmp" step="0.01" placeholder="e.g. -0.35"></div>
    </div>
    <div class="est-row">
      <div class="est-field"><label for="strTmin">Design min temp (&deg;C)</label><input type="number" id="strTmin" step="1" placeholder="e.g. -10"></div>
      <div class="est-field"><label for="strTmax">Design max temp (&deg;C)</label><input type="number" id="strTmax" step="1" placeholder="e.g. 45"></div>
      <div class="est-field"><label for="strVmax">Inverter max input (V)</label><input type="number" id="strVmax" step="1" placeholder="e.g. 1500"></div>
      <div class="est-field"><label for="strVmppt">Inverter MPPT min (V)</label><input type="number" id="strVmppt" step="1" placeholder="e.g. 200"></div>
    </div>
    <div class="est-row"><div class="est-field"><button type="button" id="strBtn">Calculate</button></div></div>
    <div class="est-result" id="strResult"></div>
  </div>
