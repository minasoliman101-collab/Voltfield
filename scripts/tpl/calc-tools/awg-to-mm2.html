<!-- Live calculator for calculators/awg-to-mm2.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="awgCalc">
    <h2>AWG to mm&sup2;</h2>
    <div class="sub">Converts conductor cross-section both ways and names the nearest IEC standard size. Area only &mdash; ampacity does not convert between NEC and IEC.</div>
    <div class="est-row">
      <div class="est-field"><label for="awgDir">Convert</label><select id="awgDir"><option value="a2m" selected>AWG or kcmil to mm&sup2;</option><option value="m2a">mm&sup2; to nearest AWG</option></select></div>
      <div class="est-field" id="awgPickWrap"><label for="awgPick">Size</label><select id="awgPick"></select></div>
      <div class="est-field" id="awgMm2Wrap" hidden><label for="awgMm2">Area (mm&sup2;)</label><input type="number" id="awgMm2" min="0" step="0.01" placeholder="e.g. 16"></div>
    </div>
    <div class="est-row"><div class="est-field"><button type="button" id="awgBtn">Convert</button></div></div>
    <div class="est-result" id="awgResult"></div>
  </div>
