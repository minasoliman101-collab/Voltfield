<!-- Live calculator for calculators/amps-to-watts.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="awCalc">
    <h2>Amps to Watts</h2>
    <div class="sub">Real power at the stated power factor. Power factor is ignored on DC, where it has no meaning.</div>
    <div class="est-row">
      <div class="est-field"><label for="awPhase">System</label><select id="awPhase"><option value="1" selected>Single-phase AC</option><option value="3">Three-phase AC</option><option value="dc">DC</option></select></div>
      <div class="est-field"><label for="awI">Current (A)</label><input type="number" id="awI" min="0" step="any" placeholder="e.g. 12.5"></div>
      <div class="est-field"><label for="awV">Voltage (V)</label><input type="number" id="awV" min="0" step="any" placeholder="e.g. 120"></div>
      <div class="est-field"><label for="awPf">Power factor</label><input type="number" id="awPf" min="0.1" max="1" step="0.01" placeholder="e.g. 1.0"></div>
    </div>
    <div class="est-row"><div class="est-field"><button type="button" id="awBtn">Calculate</button></div></div>
    <div class="est-result" id="awResult"></div>
  </div>
