<!-- Live calculator for calculators/motor-torque.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="mtCalc">
    <h2>Motor Torque</h2>
    <div class="sub">T = 5,252 &times; hp &divide; rpm. Running torque at the power and speed entered.</div>
    <div class="est-row">
      <div class="est-field"><label for="mtUnit">Power in</label><select id="mtUnit"><option value="hp" selected>hp</option><option value="kw">kW</option></select></div>
      <div class="est-field"><label for="mtP">Power (hp)</label><input type="number" id="mtP" min="0" step="any" placeholder="e.g. 50"></div>
      <div class="est-field"><label for="mtRpm">Speed (rpm)</label><input type="number" id="mtRpm" min="0" step="any" placeholder="e.g. 1775"></div>
    </div>
    <div class="est-row"><div class="est-field"><button type="button" id="mtBtn">Calculate</button></div></div>
    <div class="est-result" id="mtResult"></div>
  </div>
