<!-- Live calculator for calculators/kva-to-kw.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="convCalc">
    <h2>kVA to kW</h2>
    <div class="sub">Enter any two of the four and the rest follow. Enter three and it checks them against each other. Power factor has to come from the load &mdash; there is no default.</div>
    <div class="est-row">
      <div class="est-field"><label for="ptKva">Apparent power (kVA)</label><input type="number" id="ptKva" min="0" step="0.1" placeholder="e.g. 500"></div>
      <div class="est-field"><label for="ptKw">Real power (kW)</label><input type="number" id="ptKw" min="0" step="0.1" placeholder="e.g. 400"></div>
      <div class="est-field"><label for="ptPf">Power factor</label><input type="number" id="ptPf" min="0" max="1" step="0.01" placeholder="e.g. 0.8"></div>
      <div class="est-field"><label for="ptKvar">Reactive power (kvar)</label><input type="number" id="ptKvar" min="0" step="0.1" placeholder="optional"></div>
    </div>
    <div class="est-row"><div class="est-field"><button type="button" id="ptBtn">Solve</button></div></div>
    <div class="est-result" id="ptResult"></div>
  </div>
