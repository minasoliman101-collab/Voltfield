<!-- Live calculator for calculators/fault-current.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="faultCalc">
    <h3>Available Fault Current</h3>
    <div class="sub">%Z comes from the transformer nameplate — typical distribution transformers run 5.75%&ndash;6.5%, but always use the actual nameplate value. Common standard equipment AIC/withstand ratings: 10, 14, 18, 22, 25, 35, 42, 50, 65, 100, 150, 200 kA.</div>
    <div class="est-row">
      <div class="est-field"><label for="faultKva">Transformer (kVA)</label><input type="number" id="faultKva" min="0" step="1" placeholder="e.g. 1500"></div>
      <div class="est-field"><label for="faultZ">Impedance %Z</label><input type="number" id="faultZ" min="0.1" step="0.01" placeholder="e.g. 5.75"></div>
      <div class="est-field"><label for="faultV">Secondary voltage, L-L (V)</label><input type="number" id="faultV" min="0" step="1" placeholder="e.g. 480"></div>
    </div>
    <div class="est-row">
      <div class="est-field"><label for="faultAic">Equipment AIC/withstand rating (kA, optional)</label><input type="number" id="faultAic" min="0" step="1" placeholder="e.g. 42"></div>
      <div class="est-field"><button type="button" id="faultBtn">Calculate</button></div>
    </div>
    <div class="est-result" id="faultResult"></div>
  </div>
