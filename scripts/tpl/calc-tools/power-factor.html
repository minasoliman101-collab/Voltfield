<!-- Live calculator for calculators/power-factor.html. Logic: voltfield-calculators.js. -->
  <div class="estimator" id="pfCalc">
    <h2>PF Correction Size</h2>
    <div class="est-row">
      <div class="est-field"><label for="pfKw">Real power (kW)</label><input type="number" id="pfKw" min="0" step="1" placeholder="e.g. 400"></div>
      <div class="est-field"><label for="pfExisting">Existing PF</label><input type="number" id="pfExisting" min="0.1" max="1" step="0.01" placeholder="e.g. 0.75"></div>
      <div class="est-field"><label for="pfTarget">Target PF</label><input type="number" id="pfTarget" min="0.1" max="1" step="0.01" placeholder="e.g. 0.95"></div>
      <div class="est-field"><button type="button" id="pfBtn">Calculate</button></div>
    </div>
    <div class="est-result" id="pfResult"></div>
  </div>
