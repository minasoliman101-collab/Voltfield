/* 404. This page loads voltfield-core.css like every other, so it no longer
   redefines the design tokens -- the local :root block here predated core and

.card{max-width:540px;text-align:center}
.bolt{width:44px;height:44px;background:var(--ink);display:inline-grid;place-items:center;

.bolt svg{width:22px;height:22px}
.bolt svg path{fill:var(--signal)}
.code{font-weight:600;font-size:clamp(64px,16vw,120px);line-height:.95;color:var(--ink);
  letter-spacing:-.04em;font-variant-numeric:tabular-nums}
h1{font-weight:600;font-size:clamp(24px,5vw,34px);margin-top:8px;letter-spacing:-.028em}
p{color:var(--slate);font-size:16.5px;margin-top:14px;line-height:1.6}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:30px}
.links a{font-weight:600;font-size:15px;letter-spacing:-.01em;text-transform:none;
  text-decoration:none;padding:12px 22px;border-radius:var(--r-pill);border:1px solid transparent;
  color:var(--solid-fg);background:var(--solid-bg);
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.links a:hover{background:var(--solid-bg);color:var(--solid-fg);transform:translateY(-1px);box-shadow:var(--sh-2)}
.links a.ghost{background:var(--card);color:var(--ink);border-color:var(--line-dark)}
.links a.ghost:hover{background:var(--card);color:var(--ink);border-color:var(--line-strong)}
.pn{font-family:var(--mono);font-size:12px;color:var(--slate);margin-top:26px}
